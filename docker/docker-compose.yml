version: '3.8'
services:
  tb-gateway:
    image: eskom-pe-gateway:latest
    container_name: eskom-pe-gateway
    # restart: always
 
    network_mode: bridge
    ports:
      - "5000:5000"
      - "50000:50000/tcp"
      - "20000:20000/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TB_GW_HOST=10.128.0.59
      - TB_GW_PORT=1883
      - TB_GW_ACCESS_TOKEN=dfr27uhkh6lhh754gl1o
      - TB_GW_LOGS_PATH=/thingsboard_gateway/logs
      - MASTER_IP=10.128.0.59
      - MASTER_ID=1000
      - LOG_LEVEL=INFO
      - DISABLE_TLS=true
      - PYTHONUNBUFFERED=1
      - CRYPTOGRAPHY_DONT_BUILD_RUST=1
    volumes:
      - ./thingsboard_gateway/config:/thingsboard_gateway/config
      - ./thingsboard_gateway/logs:/thingsboard_gateway/logs
      # - ./thingsboard_gateway/extensions:/thingsboard_gateway/extensions
      - ./thingsboard_gateway/data:/thingsboard_gateway/data
      # - ./thingsboard_gateway/connectors/dnp3:/thingsboard_gateway/connectors/dnp3  # Add this line
      # - ./thingsboard_gateway/connectors/dnp3/dnp3_refactor:/thingsboard_gateway/connectors/dnp3/dnp3_refactor
      # - ./thingsboard_gateway/gateway:/thingsboard_gateway/gateway  # Add if needed
      # - ./thingsboard_gateway/tb_utility:/thingsboard_gateway/tb_utility  # Add if needed
    command: 
          - python
          - /thingsboard_gateway/tb_gateway.py
          - --config=/thingsboard_gateway/config/tb_gateway.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"